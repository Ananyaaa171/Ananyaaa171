<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Backend developer banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#FF5DA2"/>
      <stop offset="1" stop-color="#FFB84D"/>
    </linearGradient>
    <clipPath id="clip"><rect width="960" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bob1 { animation: bob 5s ease-in-out infinite; }
    .bob2 { animation: bob 6s ease-in-out -2s infinite; }
    .bob3 { animation: bob 7s ease-in-out -4s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(26px); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="960" height="240" fill="url(#bg)"/>

    <g class="drift">
      <circle cx="120" cy="230" r="110" fill="#fff" opacity="0.10"/>
      <circle cx="470" cy="20" r="70" fill="#fff" opacity="0.10"/>
      <circle cx="900" cy="210" r="90" fill="#fff" opacity="0.12"/>
    </g>

    <text class="t" x="56" y="106" font-size="40" font-weight="700" fill="#fff">Backend developer</text>
    <text class="t" x="58" y="142" font-size="18" fill="#fff" opacity="0.92">APIs, databases and a bit of machine learning</text>
    <rect x="58" y="162" width="64" height="5" rx="2.5" fill="#fff" opacity="0.85"/>

    <!-- floating app windows -->
    <g class="bob1">
      <rect x="560" y="38" width="230" height="124" rx="12" fill="#fff" opacity="0.96"/>
      <circle cx="580" cy="56" r="4" fill="#FF5DA2"/><circle cx="594" cy="56" r="4" fill="#FFB84D"/><circle cx="608" cy="56" r="4" fill="#2EC4B6"/>
      <rect x="578" y="76" width="120" height="9" rx="4.5" fill="#7C5CFF"/>
      <rect x="578" y="96" width="180" height="9" rx="4.5" fill="#E5E1FF"/>
      <rect x="578" y="116" width="150" height="9" rx="4.5" fill="#E5E1FF"/>
      <rect x="578" y="136" width="70" height="9" rx="4.5" fill="#FF5DA2"/>
    </g>
    <g class="bob2">
      <rect x="720" y="100" width="190" height="104" rx="12" fill="#fff" opacity="0.94"/>
      <circle cx="740" cy="118" r="4" fill="#FF5DA2"/><circle cx="754" cy="118" r="4" fill="#FFB84D"/><circle cx="768" cy="118" r="4" fill="#2EC4B6"/>
      <rect x="738" y="140" width="22" height="42" rx="5" fill="#2EC4B6"/>
      <rect x="770" y="152" width="22" height="30" rx="5" fill="#FFB84D"/>
      <rect x="802" y="134" width="22" height="48" rx="5" fill="#7C5CFF"/>
      <rect x="834" y="160" width="22" height="22" rx="5" fill="#FF5DA2"/>
    </g>
    <g class="bob3">
      <rect x="500" y="150" width="130" height="62" rx="12" fill="#fff" opacity="0.92"/>
      <circle cx="530" cy="181" r="14" fill="#2EC4B6"/>
      <rect x="554" y="170" width="62" height="8" rx="4" fill="#E5E1FF"/>
      <rect x="554" y="186" width="42" height="8" rx="4" fill="#FFB84D"/>
    </g>
  </g>
</svg>
